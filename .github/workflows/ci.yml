# CI untuk backend Go dan frontend Next.js.
#
# Catatan penting:
# - Modul Go ada di `backend/`, bukan di root repo. Semua perintah Go harus
#   dijalankan dengan working-directory tersebut.
# - Versi Go diambil dari `backend/go.mod` supaya tidak tertinggal saat versi
#   minimum dinaikkan.
# - Versi Node diambil dari `frontend/.nvmrc`, sama seperti cara Go memakai
#   go.mod: satu sumber kebenaran untuk CI dan mesin lokal (`nvm use`).
# - Frontend dijaga lint (ESLint), type-check, dan build. Temuan lint lama sudah
#   dibereskan, jadi gate ini bisa dinyalakan tanpa mewarisi utang.
# - Backend dijaga `go vet` dan `gofmt -l` selain build dan test. Keduanya
#   sudah bersih saat gate ini ditambahkan, jadi tidak ada utang yang diwariskan.
# - Runner dipin ke ubuntu-24.04, bukan ubuntu-latest. Label `-latest` akan
#   berpindah ke Ubuntu 26 pada Oktober 2026; pinning menjaga hasil build tetap
#   sama sampai migrasinya diuji sendiri.
# - Job e2e menjalankan `e2e/smoke.spec.ts` saja. Suite lain (nas-mode,
#   offline-upload, public-share) butuh backend hidup dan akun uji, jadi
#   sengaja dilewati di sini.
# - Semua job diberi timeout-minutes supaya proses yang menggantung tidak
#   memakan kuota 360 menit bawaan GitHub.

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Vet
        run: go vet ./...

      # `gofmt -l` hanya mencetak nama berkas, tidak pernah gagal sendiri.
      # Karena itu hasilnya diperiksa manual supaya bisa dijadikan gate.
      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Berkas berikut belum diformat. Jalankan 'gofmt -w .' di folder backend:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
          echo "Semua berkas Go sudah diformat."

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Image ubuntu-24.04 dari GitHub sudah membawa pustaka sistem yang dibutuhkan
      # Chromium, jadi `--with-deps` (apt-get, ~3 menit) tidak dipakai. Kalau suatu
      # saat browser gagal diluncurkan karena pustaka hilang, tambahkan `--with-deps`.
      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # Server produksi dinyalakan dan dimatikan oleh Playwright sendiri lewat
      # `webServer` di playwright.config.ts, jadi tidak perlu langkah terpisah.
      - name: Smoke test
        run: npx playwright test e2e/smoke.spec.ts

      # Trace dan screenshot hanya disimpan saat gagal (lihat playwright.config.ts),
      # jadi unggahan ini kosong pada run yang hijau.
      - name: Upload hasil Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: frontend/test-results
          retention-days: 7
          if-no-files-found: ignore
