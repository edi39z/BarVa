# CI untuk backend Go dan frontend Next.js.
#
# Catatan penting:
# - Modul Go ada di `backend/`, bukan di root repo. Semua perintah Go harus
#   dijalankan dengan working-directory tersebut.
# - Versi Go diambil dari `backend/go.mod` supaya tidak tertinggal saat versi
#   minimum dinaikkan.
# - Versi Node diambil dari `frontend/.nvmrc`, sama seperti cara Go memakai
#   go.mod: satu sumber kebenaran untuk CI dan mesin lokal (`nvm use`).
# - Frontend dijaga lint (ESLint), type-check, dan build. Temuan lint lama sudah
#   dibereskan, jadi gate ini bisa dinyalakan tanpa mewarisi utang.
# - Backend dijaga `go vet` dan `gofmt -l` selain build dan test. Keduanya
#   sudah bersih saat gate ini ditambahkan, jadi tidak ada utang yang diwariskan.
# - Runner dipin ke ubuntu-24.04, bukan ubuntu-latest. Label `-latest` akan
#   berpindah ke Ubuntu 26 pada Oktober 2026; pinning menjaga hasil build tetap
#   sama sampai migrasinya diuji sendiri.
# - Job e2e menjalankan `e2e/smoke.spec.ts` saja. Suite lain (nas-mode,
#   offline-upload, public-share) butuh backend hidup dan akun uji, jadi
#   sengaja dilewati di sini.
# - Job deploy memvalidasi artefak di `deploy/` tanpa menyalakan service:
#   compose di-parse, image backend di-build, unit systemd diverifikasi, dan
#   konfigurasi nginx diuji.
#   Tanpa job ini, unit systemd yang tidak bisa start bisa lolos ke `main`
#   karena job lain hanya menyentuh `backend/` dan `frontend/`.
# - Semua job diberi timeout-minutes supaya proses yang menggantung tidak
#   memakan kuota 360 menit bawaan GitHub.
# - Workflow hanya dipicu oleh perubahan yang benar-benar dibangun: `backend/`,
#   `frontend/`, `deploy/`, `migrations/`, `scripts/`, dan berkas workflow ini
#   sendiri. Perubahan dokumentasi murni tidak menjalankan apa pun. `deploy/`
#   ikut dipantau supaya perubahan unit systemd, compose, atau konfigurasi nginx
#   tidak lolos tanpa gate sama sekali; `migrations/` dan `scripts/` ikut karena
#   keduanya hanya dieksekusi di server. Daftarnya berupa whitelist, bukan
#   blacklist, supaya berkas baru di root tidak diam-diam melewatkan CI — kalau
#   suatu saat ada direktori kode baru di root, tambahkan di sini.

name: CI

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/**"
      - "migrations/**"
      - "scripts/**"
      - ".github/workflows/**"
  pull_request:
    branches: ["main"]
    paths:
      - "backend/**"
      - "frontend/**"
      - "deploy/**"
      - "migrations/**"
      - "scripts/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Vet
        run: go vet ./...

      # `gofmt -l` hanya mencetak nama berkas, tidak pernah gagal sendiri.
      # Karena itu hasilnya diperiksa manual supaya bisa dijadikan gate.
      - name: Format check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Berkas berikut belum diformat. Jalankan 'gofmt -w .' di folder backend:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
          echo "Semua berkas Go sudah diformat."

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Image ubuntu-24.04 dari GitHub sudah membawa pustaka sistem yang dibutuhkan
      # Chromium, jadi `--with-deps` (apt-get, ~3 menit) tidak dipakai. Kalau suatu
      # saat browser gagal diluncurkan karena pustaka hilang, tambahkan `--with-deps`.
      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # Server produksi dinyalakan dan dimatikan oleh Playwright sendiri lewat
      # `webServer` di playwright.config.ts, jadi tidak perlu langkah terpisah.
      - name: Smoke test
        run: npx playwright test e2e/smoke.spec.ts

      # Trace dan screenshot hanya disimpan saat gagal (lihat playwright.config.ts),
      # jadi unggahan ini kosong pada run yang hijau.
      - name: Upload hasil Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: frontend/test-results
          retention-days: 7
          if-no-files-found: ignore

  # Berkas deploy tidak dijalankan job lain, sehingga kesalahannya baru
  # terlihat saat dipakai di server. Job ini memvalidasi ketiga artefak tanpa
  # menyalakan container atau service.
  deploy:
    name: Deploy (config)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # Compose mewajibkan dua variabel ini lewat ${VAR:?}; nilai uji cukup
      # karena `config` hanya merakit ulang berkas, tidak menjalankan apa pun.
      - name: Validasi docker compose (release)
        working-directory: deploy/docker
        env:
          POSTGRES_PASSWORD: password_uji
          NAS_ADMIN_KEY: kunci_uji
          APP_URL: http://localhost:3000
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validasi docker compose (dev)
        working-directory: deploy/docker
        run: docker compose -f docker-compose.dev.yml config --quiet

      # Build sungguhan, bukan sekadar parse: Dockerfile memakai multi-stage dan
      # CGO_ENABLED=0, jadi kesalahan di sana baru terlihat saat deploy. Image
      # hanya dipakai untuk validasi lalu dibuang.
      - name: Build image backend (Dockerfile)
        run: docker build --quiet -t nas-backend:ci backend/

      # Skrip backup/restore/offsite hanya berjalan di server. shellcheck
      # menangkap kesalahan quoting dan pipeline yang baru terlihat saat
      # insiden, ketika skrip justru paling dibutuhkan.
      - name: Shellcheck skrip operasional
        run: shellcheck scripts/*.sh

      # Unit asli menunjuk /opt/nas/... dan /etc/nas/... yang tidak ada di
      # runner. Path tersebut diganti ke berkas sementara supaya yang diperiksa
      # sintaks unitnya, bukan isi server. User=nas dibuat agar verifikasi tidak
      # mengeluh soal akun yang tidak ada.
      - name: Validasi unit systemd
        run: |
          set -euo pipefail
          sudo useradd --system --no-create-home nas 2>/dev/null || true
          work=$(mktemp -d)
          : > "$work/backend.env"
          for unit in deploy/systemd/*.service; do
            name=$(basename "$unit")
            sed -e 's#^ExecStart=.*#ExecStart=/bin/true#' \
                -e 's#^WorkingDirectory=.*#WorkingDirectory=/tmp#' \
                -e "s#^EnvironmentFile=.*#EnvironmentFile=$work/backend.env#" \
                "$unit" > "$work/$name"
            systemd-analyze verify "$work/$name"
          done

      # Regresi yang pernah lolos: kredensial ditulis langsung di unit.
      - name: Pastikan rahasia tidak ditulis di unit
        run: |
          set -euo pipefail
          for unit in deploy/systemd/*.service; do
            if grep -Eq '^Environment="(DATABASE_URL|NAS_ADMIN_KEY)=' "$unit"; then
              echo "$unit: DATABASE_URL dan NAS_ADMIN_KEY harus lewat EnvironmentFile, bukan Environment= di unit." >&2
              exit 1
            fi
          done

      # nas.conf hanya berisi blok server, jadi dibungkus http{} minimal.
      - name: Validasi konfigurasi nginx
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx-light >/dev/null
          work=$(mktemp -d)
          {
            echo "events {}"
            echo "http {"
            echo "  include /etc/nginx/mime.types;"
            echo "  include $PWD/deploy/nginx/nas.conf;"
            echo "}"
          } > "$work/nginx.conf"
          sudo nginx -t -c "$work/nginx.conf"
