version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "../migrations/000001_init_schema.up.sql"
      - "../migrations/000002_user_quota.up.sql"
      - "../migrations/000003_search_text.up.sql"
    queries: "db/queries"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
