services:
  postgres:
    image: postgres:17-alpine
    container_name: nas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nas_admin
      # WAJIB diisi lewat deploy/docker/.env — lihat .env.example.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di deploy/docker/.env}"
      POSTGRES_DB: nas_db
    volumes:
      - nas_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nas_admin -d nas_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nas-network

  nas-backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: nas-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://nas_admin:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di deploy/docker/.env}@postgres:5432/nas_db?sslmode=disable"
      STORAGE_DIR: "/data/storage"
      TEMP_DIR: "/data/tmp"
      # Metadata Google Drive & undangan, plus cache thumbnail. Tanpa ini
      # backend memakai ./data di dalam container dan isinya hilang saat
      # container dibuat ulang.
      DATA_DIR: "/app/data"
      THUMBNAIL_DIR: "/app/data/thumbnails"
      MIGRATIONS_DIR: "/app/migrations"
      APP_URL: "${APP_URL:?APP_URL wajib diisi di deploy/docker/.env}"
      GIN_MODE: "release"
      # WAJIB. Di mode release backend menolak start tanpa kunci ini, karena
      # di balik reverse proxy semua request tampak berasal dari IP privat.
      NAS_ADMIN_KEY: "${NAS_ADMIN_KEY:?NAS_ADMIN_KEY wajib diisi di deploy/docker/.env}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
      MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-}"
    volumes:
      - nas_storage:/data/storage
      - nas_tmp:/data/tmp
      - nas_data:/app/data
      # Migrasi dijalankan backend saat start; jangan mount ke initdb postgres.
      - ../../migrations:/app/migrations:ro
    ports:
      # Hanya loopback: nginx adalah pintu masuk, port backend tidak boleh
      # terjangkau langsung dari jaringan.
      - "127.0.0.1:8080:8080"
    networks:
      - nas-network

volumes:
  nas_pgdata:
  nas_storage:
  nas_tmp:
  nas_data:

networks:
  nas-network:
    driver: bridge
