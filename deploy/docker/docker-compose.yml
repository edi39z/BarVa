services:
  postgres:
    image: postgres:17-alpine
    container_name: nas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nas_admin
      # WAJIB diisi lewat deploy/docker/.env — lihat .env.example.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di deploy/docker/.env}"
      POSTGRES_DB: nas_db
    volumes:
      - nas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nas_admin -d nas_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nas-network

  nas-backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: nas-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://nas_admin:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi di deploy/docker/.env}@postgres:5432/nas_db?sslmode=disable"
      STORAGE_DIR: "/data/storage"
      TEMP_DIR: "/data/tmp"
      # Metadata Google Drive & undangan, plus cache thumbnail. Tanpa ini
      # backend memakai ./data di dalam container dan isinya hilang saat
      # container dibuat ulang.
      DATA_DIR: "/app/data"
      THUMBNAIL_DIR: "/app/data/thumbnails"
      MIGRATIONS_DIR: "/app/migrations"
      APP_URL: "${APP_URL:?APP_URL wajib diisi di deploy/docker/.env}"
      GIN_MODE: "release"
      # WAJIB. Di mode release backend menolak start tanpa kunci ini, karena
      # di balik reverse proxy semua request tampak berasal dari IP privat.
      NAS_ADMIN_KEY: "${NAS_ADMIN_KEY:?NAS_ADMIN_KEY wajib diisi di deploy/docker/.env}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-}"
      MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-}"
      EXTERNAL_HDD_DIR: "/mnt/hdd500"
    volumes:
      - ${BARVA_STORAGE_DIR:-nas_storage}:/data/storage
      - ${BARVA_TMP_DIR:-nas_tmp}:/data/tmp
      - ${BARVA_DATA_DIR:-nas_data}:/app/data
      # Mount HDD eksternal 500GB secara READ-ONLY (:ro) agar 82GB data lama
      # pengguna 100% aman dari terhapus atau korup di level container Docker.
      - ${BARVA_HDD_ROOT:-/mnt/hdd500}:/mnt/hdd500:ro
      # Migrasi dijalankan backend saat start; jangan mount ke initdb postgres.
      - ../../migrations:/app/migrations:ro
    ports:
      # Port 8080 dibuka agar mode LAN/Tailscale (http://IP:3002 -> http://IP:8080)
      # tetap berfungsi tanpa batas 100 MB Cloudflare.
      - "${BACKEND_BIND_PORT:-8082}:8080"
    networks:
      - nas-network

  nas-frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: nas-frontend
    restart: unless-stopped
    depends_on:
      - nas-backend
    ports:
      - "${FRONTEND_BIND_PORT:-3002}:3000"
    networks:
      - nas-network

  nas-nginx:
    image: nginx:1.27-alpine
    container_name: nas-nginx
    restart: unless-stopped
    depends_on:
      - nas-frontend
      - nas-backend
    volumes:
      - ../nginx/nas.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NGINX_BIND_PORT:-8088}:80"
    networks:
      - nas-network

volumes:
  nas_pgdata:
  nas_storage:
  nas_tmp:
  nas_data:

networks:
  nas-network:
    driver: bridge
