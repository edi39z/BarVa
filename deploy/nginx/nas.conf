# ==============================================================================
# Nginx Reverse Proxy Configuration for Barva
# ==============================================================================

upstream nas_backend_upstream {
    server nas-backend:8080;
    keepalive 32;
}

upstream nas_frontend_upstream {
    server nas-frontend:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name barva.barnibar.my.id nas.local barnibar.nas _;

    # Maximum file upload size (10 GB for 4K video / disk backups)
    client_max_body_size 10G;
    client_body_timeout 300s;

    # Performance buffers
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Health check endpoint
    location = /health {
        proxy_pass http://nas_backend_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 1. API & Backend Streaming
    location /api/ {
        proxy_pass http://nas_backend_upstream;
        proxy_http_version 1.1;

        # Disable proxy buffering for video range streaming
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Range headers for HTTP 206 Partial Content
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Public Share Downloads
    location /s/ {
        proxy_pass http://nas_frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Frontend Next.js PWA
    location / {
        proxy_pass http://nas_frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
