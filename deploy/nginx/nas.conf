# ==============================================================================
# Nginx Reverse Proxy Configuration for NAS Cloud
# ==============================================================================

upstream nas_backend_upstream {
    server 127.0.0.1:8080;
    keepalive 32;
}

upstream nas_frontend_upstream {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name nas.local barnibar.nas;

    # Maximum file upload size (10 GB for 4K video / disk backups)
    client_max_body_size 10G;
    client_body_timeout 300s;

    # Performance buffers
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # 1. API & Backend Streaming
    location /api/ {
        proxy_pass http://nas_backend_upstream;
        proxy_http_version 1.1;

        # Disable proxy buffering for video range streaming
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Range headers for HTTP 206 Partial Content
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
    }

    # Public Share Downloads
    location /s/ {
        proxy_pass http://nas_frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 2. Frontend Next.js PWA
    location / {
        proxy_pass http://nas_frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
